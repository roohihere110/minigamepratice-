
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="minigame.css">
    <!-- JavaScript File -->
    <script src="minigame.js" defer></script>
</head>

<body>

    <div class="game-container">

        <h1>Number Guessing Game</h1>

        <p class="description">
            Guess a secret number between 1 and 10.
        </p>

        <div class="game-box">

            <h2>Can You Guess It?</h2>

            <label for="guessInput">Enter Your Number:</label>

            <input
                type="number"
                id="guessInput"
                min="1"
                max="10"
                placeholder="Enter 1 to 10"
            >

            <button id="guessButton">
                Check Number
            </button>

            <p id="message">
                Good luck! Start guessing.
            </p>

            <p class="attempts">
                Attempts: <span id="attempts">0</span>
            </p>

            <button id="resetButton" class="reset-btn">
                Play Again
            </button>

        </div>

    </div>

</body>
</html>
